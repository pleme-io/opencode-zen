# OpenCode Zen — chat completions.
#
# WHY THIS FILE EXISTS. This repo shipped generated code with no spec beside it,
# and that absence had a concrete cost rather than a theoretical one: the
# generated `create_chat_completion` never applied `bearer_access_token`, so
# every request went out unauthenticated and the crate could not work against
# the live service. With no spec, the omission could not be diagnosed at its
# source and could not be corrected at its source — the 2026-08-17 fix had to be
# hand-written into generated code, where the next regeneration would silently
# drop it.
#
# The `security` block below is the durable form of that fix. openapi-generator
# emits the auth application itself when a spec declares a security scheme, so
# with this file in place the bug is not "fixed" — it is regenerated away, and
# cannot come back through the door it came in.
#
# PROVENANCE, stated plainly because it changes how much you should trust it:
# this spec was RECONSTRUCTED on 2026-08-17 from the generated Rust models in
# src/models/ and the request builder in src/apis/default_api.rs, which are the
# only ground truth this repo contains. It is not the vendor's published spec.
# Every field, its type and its optionality mirror what the generated code
# already declared; nothing was invented. Where the vendor publishes a spec of
# their own, this should be replaced by theirs rather than reconciled with it.
#
# The endpoint is OpenAI chat-completions compatible, so the shape is familiar,
# but only the fields actually present in this repo's models are described here.
openapi: 3.0.3

info:
  title: OpenCode Zen — Chat Completions
  description: |
    The OpenAI-compatible chat-completions endpoint served at
    https://opencode.ai/zen/v1.

    Reconstructed from the generated client in this repository; see the comment
    at the top of this file for what that does and does not guarantee.
  version: 1.0.0
  license:
    name: MIT

servers:
  - url: https://opencode.ai/zen/v1
    description: OpenCode Zen

# THE POINT OF THIS FILE. Declaring the scheme here is what makes the generator
# emit `req_builder = req_builder.bearer_auth(...)` into the request path. The
# service expects `Authorization: Bearer <key>`; it is NOT an api-key header, and
# the README used to tell callers otherwise.
security:
  - bearerAuth: []

paths:
  /chat/completions:
    post:
      operationId: createChatCompletion
      summary: Create a chat completion
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateChatCompletionRequest'
      responses:
        '200':
          description: The completion.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateChatCompletionResponse'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer

  schemas:
    CreateChatCompletionRequest:
      type: object
      required:
        - model
        - messages
      properties:
        model:
          type: string
          description: Model id, e.g. `big-pickle`.
        messages:
          type: array
          items:
            $ref: '#/components/schemas/ChatMessage'
        temperature:
          type: number
          format: double
        max_tokens:
          type: integer
          format: int32
        stream:
          type: boolean

    ChatMessage:
      type: object
      required:
        - role
        - content
      properties:
        # An ENUM, not a free string. This is why the generated client's
        # ChatMessage.role is a `Role` type: an invalid role is a compile error
        # rather than a runtime 400. Keep it an enum.
        role:
          type: string
          enum: [system, user, assistant]
        content:
          type: string

    # Every field here is optional, and deliberately so: an error-shaped or
    # partial reply must deserialize rather than panic. A caller indexing
    # `choices[0]` is the bug this optionality exists to prevent.
    CreateChatCompletionResponse:
      type: object
      properties:
        id:
          type: string
        object:
          type: string
        created:
          type: integer
          format: int32
        model:
          type: string
        choices:
          type: array
          items:
            $ref: '#/components/schemas/ChatChoice'
        usage:
          $ref: '#/components/schemas/Usage'

    ChatChoice:
      type: object
      properties:
        index:
          type: integer
          format: int32
        message:
          $ref: '#/components/schemas/ChatMessage'
        finish_reason:
          type: string

    Usage:
      type: object
      properties:
        prompt_tokens:
          type: integer
          format: int32
        completion_tokens:
          type: integer
          format: int32
        total_tokens:
          type: integer
          format: int32
