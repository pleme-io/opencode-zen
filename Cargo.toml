[package]
name = "opencode-zen"
version = "0.1.3"
edition = "2021"
description = "Auto-generated Rust SDK for OpenCode Zen API (chat completions)"
license = "MIT"
authors = ["Pleme Team <team@pleme.io>"]
repository = "https://github.com/pleme-io/opencode-zen"
homepage = "https://github.com/pleme-io/opencode-zen"
keywords = ["opencode", "ai", "api", "sdk", "openapi"]
# "ai" is not a crates.io slug; the registry's is "artificial-intelligence".
# The `categories` field is validated ONLY at upload, so a wrong slug is
# invisible locally and fails the whole release with a 400 the first time a
# publish actually reaches the registry.
categories = ["api-bindings", "artificial-intelligence"]

# Generated from: OpenAI Chat Completions API (OpenCode Zen compatible)
# Generator: openapi-generator-cli (rust client, reqwest library)

[dependencies]
serde = { version = "^1.0", features = ["derive"] }
serde_json = "^1.0"
serde_repr = "^0.1"
url = "^2.5"
reqwest = { version = "^0.12", default-features = false, features = ["json", "multipart"] }

# Only the compiled usage example needs an async runtime; the library itself
# is runtime-agnostic and must stay that way.
[dev-dependencies]
tokio = { version = "^1", features = ["macros", "rt-multi-thread"] }
# tests/spec_matches_models.rs reads openapi.yaml and compares it against the
# generated models. Dev-only: the library must not gain a YAML parser.
serde_yaml = "^0.9"

[features]
default = ["rustls-tls"]
native-tls = ["reqwest/native-tls"]
rustls-tls = ["reqwest/rustls-tls"]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
